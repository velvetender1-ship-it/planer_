<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>برنامه‌ریز مشاور — دمو</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1A2B4A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="برنامه‌ریز">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--p:#6d28d9;--p2:#8b5cf6;--pl:#f1ebff;--pl2:#e4d9ff;--bg:#f6f5fb;--card:#fff;--ink:#1b1530;--mut:#6f6b85;--line:#e9e6f3;--dark:#1a1233;--dark2:#2a2147;--ok:#16a34a;--warn:#c2410c;--bad:#dc2626;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.app{max-width:1200px;margin:0 auto;display:flex;min-height:100vh}
nav.side{display:none}
main{flex:1;min-width:0;padding:18px 16px 110px}
nav.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:20}
.nb{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--mut);padding:6px 16px;border-radius:14px}
.nb svg{width:22px;height:22px}
.nb.on{color:var(--p);background:var(--pl)}
@media(min-width:960px){
 nav.bottom{display:none}
 nav.side{display:flex;flex-direction:column;gap:6px;width:220px;padding:22px 14px;position:sticky;top:0;height:100vh;border-left:1px solid var(--line);background:#fff}
 nav.side .brand{font-weight:800;font-size:18px;margin:0 8px 18px;color:var(--p)}
 nav.side .nb{flex-direction:row;gap:10px;font-size:15px;padding:11px 14px;justify-content:flex-start}
 main{padding:26px 30px 120px}
}
h1{font-size:26px;margin:0;font-weight:800}
h2{font-size:18px;margin:0 0 10px;font-weight:800}
.sub{color:var(--mut);font-size:14px;margin-top:4px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wrap{flex-wrap:wrap}
.card{background:var(--card);border-radius:var(--r);border:1px solid var(--line);padding:16px}
.mt{margin-top:16px}.mt2{margin-top:24px}.mt1{margin-top:8px}
.btn{background:var(--p);color:#fff;border-radius:14px;padding:12px 20px;font-weight:700;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:disabled{background:#d9cff7;color:#fff;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--p);border:1.5px solid var(--pl2)}
.btn.dark{background:var(--dark);color:#fff}
.btn.sm{padding:8px 14px;font-size:14px;border-radius:12px}
.btn.block{width:100%}
.btn.danger{background:#fff;color:var(--bad);border:1.5px solid #f5caca}
.fab{width:62px;height:62px;border-radius:50%;background:var(--p);color:#fff;font-size:32px;display:grid;place-items:center;box-shadow:0 8px 24px #6d28d955}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;display:inline-flex;align-items:center;gap:8px;font-size:14px;white-space:nowrap}
.chip.on{border-color:var(--p);background:var(--pl);color:var(--p);font-weight:700}
.chip .dot{width:9px;height:9px;border-radius:50%}
.chip.dash{border-style:dashed;color:var(--p)}
.chip .cnt{background:#f0eef6;border-radius:999px;min-width:26px;height:26px;display:grid;place-items:center;font-size:13px}
.chip.on .cnt{background:#5b21b6;color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.badge{font-size:12px;border-radius:999px;padding:3px 10px;font-weight:700;white-space:nowrap}
.b-none{background:#fde8ec;color:#b4234a}.b-draft{background:#fff1d6;color:#9a4b05}.b-active{background:#dcfce7;color:#15803d}.b-shared{background:var(--pl);color:var(--p)}
.av{width:46px;height:46px;border-radius:50%;background:var(--pl);color:var(--p);display:grid;place-items:center;font-weight:800;border:2px solid var(--pl2);flex:none}
.assist{background:var(--dark);color:#fff;border-radius:22px;padding:18px}
.assist .in{display:flex;gap:8px;margin-top:12px}
.assist input{flex:1;background:var(--dark2);border:0;border-radius:14px;padding:13px 14px;color:#fff;outline:none}
.assist input::placeholder{color:#b9b0d8}
.assist .hint{color:#c4b5fd;font-size:13px;margin-top:10px;line-height:1.8}
.spark{color:#c4b5fd}
.seg{display:flex;background:#efedf5;border-radius:16px;padding:5px;gap:4px}
.seg button{flex:1;padding:10px 6px;border-radius:12px;color:var(--mut);font-size:14px;white-space:nowrap}
.seg button.on{background:#fff;color:var(--ink);font-weight:800;box-shadow:0 2px 8px #0000000f}
.seg button small{display:block;font-size:12px;color:var(--mut);font-weight:400}
.banner{border:2px solid #f6d58b;background:#fffdf6;border-radius:20px;padding:14px 16px}
.list{background:#fff;border-radius:22px;border:1px solid var(--line);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .nm{font-weight:800;font-size:16px}
.li .st{font-size:13px;margin-top:3px;color:var(--mut)}
.prog{height:6px;background:#eee9f8;border-radius:9px;overflow:hidden;width:120px}
.prog i{display:block;height:100%;background:var(--ok)}
.opt{display:flex;gap:14px;align-items:flex-start;padding:16px;border:2px solid var(--line);border-radius:20px;background:#fff;text-align:right;width:100%}
.opt.on{border-color:var(--p)}
.opt:disabled{opacity:.5}
.opt .ic{width:50px;height:50px;border-radius:14px;background:#f1f0f6;display:grid;place-items:center;font-size:22px;flex:none}
.opt .ic.d{background:var(--dark);color:#c4b5fd}
.opt b{display:block;font-size:16px}
.opt span{color:var(--mut);font-size:14px;line-height:1.8}
.inp{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;background:#fbfaff;outline:none}
.inp:focus{border-color:var(--p2)}
label.lb{display:block;font-weight:800;margin:18px 0 10px}
.grid2{display:grid;gap:16px}.grid2>div{min-width:0}
@media(min-width:960px){.grid2{grid-template-columns:1fr 340px;align-items:start}.stick{position:sticky;top:20px}}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.day{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:8px 2px;text-align:center;position:relative}
.day .dn{font-size:13px;color:var(--mut)}
.day .dd{font-size:20px;font-weight:800;line-height:1.4}
.day .dh{font-size:11px;color:var(--mut)}
.day .bar{height:4px;border-radius:4px;margin:4px 8px 0;background:#eee}
.day.on{background:var(--p);border-color:var(--p);color:#fff}
.day.on .dn,.day.on .dh{color:#e9e2ff}
.day.today::after{content:"";position:absolute;top:6px;left:8px;width:6px;height:6px;border-radius:50%;background:var(--ok)}
.task{display:flex;background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.task .clr{width:7px;flex:none}
.task .bd{flex:1;padding:12px 14px;min-width:0}
.task .tm{font-weight:800;font-size:14px;direction:ltr;text-align:right}
.task .ttl{font-weight:800;margin-top:2px}
.task .meta{color:var(--mut);font-size:13px;margin-top:4px;line-height:1.7}
.task .note{background:#faf8ff;border-radius:10px;padding:6px 10px;font-size:13px;margin-top:6px;color:#4c4470}
.task .dsc{font-size:14px;color:#3b3355;margin-top:2px;font-weight:600}
.task.done .ttl{text-decoration:line-through;color:var(--mut)}
.task .acts{display:flex;gap:0;padding:6px 4px;align-items:flex-start}
.ib{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--mut);font-size:17px}
.ib:hover{background:#f3f1f9}
.tp{font-size:12px;border-radius:8px;padding:2px 8px;font-weight:700;color:#fff;border:1.5px solid #0F1720}
.gap{text-align:center;font-size:12px;color:var(--mut);padding:2px}
.conf{background:#fdecec;color:var(--bad);font-size:12px;border-radius:8px;padding:2px 8px;font-weight:700}
.empty{background:#fff;border-radius:22px;padding:34px 16px;text-align:center;border:1px solid var(--line)}
.empty b{font-size:18px}
.bottombar{position:fixed;left:0;right:0;bottom:70px;z-index:15;pointer-events:none}
.bottombar .in{max-width:1200px;margin:0 auto;padding:0 16px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.bottombar .in>*{pointer-events:auto}
@media(min-width:960px){.bottombar{bottom:20px}.bottombar .in{padding-right:250px;padding-left:30px}}
.sumbar{background:#fff;border-radius:22px;border:1px solid var(--line);box-shadow:0 -6px 30px #1b153014;padding:12px 14px;display:flex;align-items:center;gap:14px;justify-content:space-between;flex:1}
.sumbar b{font-size:18px}
.floaters{display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.pill-dark{background:var(--dark);color:#fff;border-radius:999px;padding:13px 18px;display:flex;gap:8px;align-items:center;font-weight:700;box-shadow:0 8px 24px #1a123344}
.bal .br{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:13px}
.bal .br .nm{width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bal .tr{flex:1;height:10px;background:#f0eef6;border-radius:10px;overflow:hidden}
.bal .tr i{display:block;height:100%;border-radius:10px}
.bal .v{width:62px;text-align:left;color:var(--mut)}
details.card summary{font-weight:800;cursor:pointer;list-style:none}
details.card summary::before{content:"◂ ";color:var(--p)}
details[open].card summary::before{content:"▾ "}
.week{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(150px,1fr);gap:8px;overflow-x:auto;padding-bottom:8px}
.wcol{background:#fff;border:1px solid var(--line);border-radius:16px;padding:8px;min-height:140px}
.wcol h4{margin:0 0 6px;font-size:14px;text-align:center}
.wcol h4 small{display:block;color:var(--mut);font-weight:400}
.wt{border-radius:10px;padding:6px 8px;margin-bottom:6px;font-size:12px;background:#faf9fd;border-right:4px solid}
.wt b{display:block;font-size:12.5px}
@media print{nav,.noprint,.toast,#ov,.bottombar{display:none!important}main{padding:0!important}.app{display:block}body{background:#fff}}
.cal{background:var(--card);border:2px solid var(--k);border-radius:18px;padding:14px;box-shadow:4px 4px 0 var(--k)}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.calh{text-align:center;font-size:12px;color:var(--mut);font-weight:700}
.cald{aspect-ratio:1.15;border:1.5px solid var(--line);border-radius:12px;background:var(--card);font-weight:700;font-size:15px}
.cald.on{background:var(--navy);color:#fff;border-color:var(--k);box-shadow:2px 2px 0 var(--k)}.cald.tod{outline:2.5px solid var(--mus);outline-offset:-2px}.cald.rs{background:var(--ms);border-color:var(--k)}
@media(min-width:960px){.grid2[style*="none"]{grid-template-columns:1.1fr 1fr!important;display:grid}}
.hs{flex-wrap:nowrap;overflow-x:auto;padding:2px 2px 8px}
@media(max-width:700px){table.ck .st0{min-width:108px;font-size:12px}}
.ckw{overflow:auto;max-height:72vh;border:2px solid var(--k);border-radius:14px;background:var(--card);box-shadow:4px 4px 0 var(--k)}
table.ck{border-collapse:separate;border-spacing:0;font-size:13px;min-width:100%}
table.ck th{position:sticky;top:0;background:var(--navy);color:#fff;padding:6px 4px;font-weight:700;z-index:2;border-left:1px solid #ffffff30;min-width:62px;font-size:12px;line-height:1.4}
table.ck thead tr:nth-child(2) th{top:31px}table.ck th.grp{background:var(--mus);color:#0F1720}
table.ck td{border-bottom:1px solid var(--line);border-left:1px solid var(--line);padding:3px;text-align:center}
table.ck .st0{position:sticky;right:0;background:var(--card);text-align:right;min-width:150px;max-width:220px;padding:6px 10px;z-index:1;font-weight:600}
table.ck th.st0{background:var(--navy);z-index:3}
table.ck tr.chr td{background:var(--ns);font-weight:800;text-align:right;padding:6px 10px}
.ckb{width:100%;min-width:52px;height:32px;border-radius:9px;border:1.5px solid var(--line);background:var(--bg);font-weight:800;font-size:13px;color:var(--mut)}
.ckb.on{background:var(--teal);color:#fff;border-color:var(--k)}.ckb.lv{font-size:11.5px}
.wi{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}.wi.off{opacity:.45;text-decoration:line-through}
.help{line-height:2;font-size:14.5px}.help h3{margin:0 0 6px;font-size:17px}.help ul{padding-right:18px;margin:6px 0}.help p{margin:6px 0}
.task.opt{border:2px dashed #8b93a7!important;box-shadow:none!important;background:color-mix(in srgb,var(--card) 88%,var(--bg))}
.optb{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;font-weight:800;color:var(--mut);margin-bottom:4px}.optb button{border:1.5px solid var(--k);border-radius:8px;padding:1px 8px;font-size:12px;background:var(--card)}
.qgrid{display:grid;gap:14px}@media(min-width:1100px){.qgrid{grid-template-columns:1fr 1fr}}
.qrow{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line)}.ql{width:64px;flex:none;font-weight:800;font-size:13px;padding-top:8px}.ql small{display:block;font-weight:400;color:var(--mut);font-size:11.5px}
.qta{padding:8px 10px!important;resize:vertical;min-height:40px;line-height:1.7}.qp{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}.qpi{font-size:11.5px;background:var(--ns);border-radius:7px;padding:1px 7px;color:var(--ink)}.qpi.bad{background:var(--rs);color:var(--rust)}
.exm{font-size:11px;position:absolute;top:2px;right:4px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.kpi{background:var(--card);border:2px solid var(--k);box-shadow:3px 3px 0 var(--k);border-radius:16px;padding:12px}.kpi b{display:block;font-size:24px;font-weight:800}.kpi span{font-size:13px;font-weight:700}.kpi small{display:block;color:var(--mut);font-size:12px}
.rb{display:grid;gap:8px;margin-top:6px}.rbr{display:grid;grid-template-columns:minmax(80px,140px) 1fr auto;gap:8px;align-items:center;font-size:13px}.rbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rbt{height:12px;background:var(--bg);border:1.5px solid var(--line);border-radius:8px;overflow:hidden}.rbt i{display:block;height:100%}.rbv{color:var(--mut);font-size:12px;white-space:nowrap}
@media(max-width:700px){.rbr{grid-template-columns:1fr auto;row-gap:3px}.rbt{grid-column:1/-1;order:3}}
@media(max-width:959px){nav.bottom .nb{padding:6px 4px;font-size:11px;flex:1;min-width:0}nav.bottom .nb span{white-space:nowrap}}
@media(min-width:960px){.grid2[style*="none"]{grid-template-columns:1fr 1fr!important}}
/* overlay */
#ov{position:fixed;inset:0;z-index:50;display:none}
#ov.show{display:block}
#ov .bk{position:absolute;inset:0;background:#120c2499;backdrop-filter:blur(3px)}
.sheet{position:absolute;bottom:0;left:0;right:0;max-height:92vh;background:#fff;border-radius:26px 26px 0 0;display:flex;flex-direction:column;animation:up .22s ease}
@media(min-width:760px){.sheet{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:640px;border-radius:26px;max-height:90vh;animation:none}}
@media(min-width:760px){.sheet.wide{width:760px}}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
.sh-h{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.sh-h h3{margin:0;font-size:21px;font-weight:800}
.x{width:42px;height:42px;border-radius:12px;background:#f3f1f9;font-size:20px;color:var(--mut)}
.sh-b{overflow-y:auto;padding:6px 20px 20px;flex:1}
.sh-f{border-top:1px solid var(--line);padding:12px 20px calc(14px + env(safe-area-inset-bottom))}
.summ{display:flex;gap:8px;align-items:center;color:#4a4560;font-size:14px;margin-bottom:10px}
.summ i{width:10px;height:10px;border-radius:50%;flex:none}
.tsec{font-size:12px;color:var(--mut);margin:12px 0 6px;font-weight:700}
.tag{font-size:11px;border-radius:6px;padding:1px 6px;font-weight:700}
.t-new{background:#e0f2fe;color:#0369a1}.t-rev{background:#fff1d6;color:#9a4b05}.t-ok{background:#dcfce7;color:#15803d}.t-cus{background:var(--pl);color:var(--p)}
.step{display:flex;align-items:center;gap:6px}
.step button{width:42px;height:42px;border:1.5px solid var(--line);border-radius:12px;font-size:20px;background:#fff}
.step b{min-width:46px;text-align:center;font-size:18px}
.tbox{display:flex;align-items:center;gap:10px}
.tbox input{width:120px;text-align:center;font-size:20px;font-weight:800;border:1.5px solid var(--line);border-radius:16px;padding:12px;direction:ltr;background:#fff}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;margin-top:10px}
.sw{width:46px;height:28px;border-radius:20px;background:#ddd8ea;position:relative;flex:none;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--p)}.sw.on::after{right:21px}
.op{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}
.op .k{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;font-weight:800;flex:none;color:#fff}
.k-add{background:var(--ok)}.k-del{background:var(--bad)}.k-move{background:#2563eb}.k-upd{background:#d97706}
.chk{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.8}
.chk .s{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:800}
.s-ok{background:#dcfce7;color:#15803d}.s-w{background:#fff1d6;color:#9a4b05}.s-b{background:#fde8ec;color:#b4234a}

.toast button{color:#c4b5fd;font-weight:800}
.menu{position:absolute;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 40px #1b153022;padding:6px;z-index:60;min-width:230px}

.menu button:hover{background:var(--pl)}
.menu button.red{color:var(--bad)}
.hstep{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.hstep div{text-align:center;border:1.5px solid var(--line);border-radius:14px;padding:6px 2px}
.hstep small{color:var(--mut);font-size:12px}
.hstep b{display:block;font-size:17px}
.hstep button{width:100%;font-size:18px;color:var(--p);line-height:1.2}
.subjw{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border:1.5px solid var(--line);border-radius:14px;gap:8px}
.subjw .w{display:flex;gap:3px}
.subjw .w i{width:16px;height:8px;border-radius:4px;background:#e9e6f3}
.acc{border:1px solid var(--line);border-radius:16px;background:#fff;margin-bottom:10px}
.acc>summary{padding:14px 16px;font-weight:800;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.acc .in{padding:0 16px 14px}
.chap{margin-top:10px}
.chap h5{margin:0 0 6px;font-size:13px;color:var(--mut)}
.tchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:5px 10px;margin:0 0 6px 6px;font-size:13px;background:#fcfbff}

function hm(m){m=Math.max(0,Math.round(m));return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}

function dur(m){m=Math.round(m);const h=Math.floor(m/60),r=m%60;if(!h)return fa(r)+' دقیقه';return fa(h)+' ساعت'+(r?' و '+fa(r)+' دقیقه':'')}

function r15(x){return Math.max(15,Math.round(x/15)*15)}
const pDate=(d,o)=>new Intl.DateTimeFormat('fa-IR-u-ca-persian',o).format(d);
function satOf(d){d=new Date(d.getFullYear(),d.getMonth(),d.getDate());d.setDate(d.getDate()-((d.getDay()+1)%7));return d}
function key(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fromKey(k){const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)}
function weekKey(off=0){const s=satOf(new Date());s.setDate(s.getDate()+7*off);return key(s)}
function dayDate(wk,i){const d=fromKey(wk);d.setDate(d.getDate()+i);return d}
function dLabel(wk,i){return pDate(dayDate(wk,i),{day:'numeric',month:'long'})}
function wLabel(wk){const a=dayDate(wk,0),b=dayDate(wk,6);return pDate(a,{day:'numeric'})+' '+pDate(a,{month:'long'})+' تا '+pDate(b,{day:'numeric'})+' '+pDate(b,{month:'long'})}
function absDay(wk,i){return Math.round(dayDate(wk,i).getTime()/864e5)}
function todayIdx(wk){const t=absDay(key(new Date()),0)-absDay(wk,0);return t>=0&&t<7?t:-1}

/* ========== scheduling core ========== */
function dayTasks(tasks,d){return tasks.filter(t=>t.day===d).sort((a,b)=>(!!a.notime-!!b.notime)||a.start-b.start)}
function tl(t){return t.notime?'⏱ '+dur(t.end-t.start):'\u2066'+fhm(t.start)+'–'+fhm(t.end)+'\u2069'}
function tlTxt(t){return t.notime?'⏱ '+(t.end-t.start)+' دقیقه':hm(t.start)+'–'+hm(t.end)}
function dayMin(tasks,d){return tasks.filter(t=>t.day===d).reduce((a,t)=>a+(t.end-t.start),0)}
function firstFree(tasks,d,len,from,p){const ds=from??(p?p.start:S.settings.dayStart),de=p?p.end:S.settings.dayEnd;let t=ds;for(const x of dayTasks(tasks,d).filter(x=>!x.notime)){if(x.end<=t)continue;if(x.start-t>=len)return t;t=Math.max(t,x.end)}return de-t>=len?t:null}
function gaps(tasks,d,p){const out=[];let t=p.start;for(const x of dayTasks(tasks,d).filter(x=>!x.notime)){if(x.start-t>=30)out.push([t,x.start]);t=Math.max(t,x.end)}if(p.end-t>=30)out.push([t,p.end]);return out}
function conflicts(tasks){const ids=new Set();const mx=Math.max(-1,...tasks.map(t=>t.day));for(let d=0;d<=mx;d++){const l=dayTasks(tasks,d).filter(x=>!x.notime);for(let i=0;i<l.length;i++)for(let j=i+1;j<l.length;j++)if(l[j].start<l[i].end){ids.add(l[i].id);ids.add(l[j].id)}}return ids}
function mpt(sid){return MPT[fam(sid||'')]||1.5}
function learnedKeys(plan,sid){const set=new Set();S.plans.filter(p=>p.sids.includes(sid)&&p.wk<plan.wk).forEach(p=>p.tasks.forEach(t=>{if(t.type==='learn')t.topics.forEach(x=>set.add(t.subj+'::'+x))}));plan.tasks.forEach(t=>{if(t.type==='learn')t.topics.forEach(x=>set.add(t.subj+'::'+x))});return set}
function nextTopic(sid,used){const all=topicsOf(sid);const f=all.find(t=>!used.has(sid+'::'+t.l));const pick=f||all[Math.floor(Math.random()*all.length)];if(pick)used.add(sid+'::'+pick.l);return pick?[pick.l]:[]}
function mkTask(o){return Object.assign({id:uid(),day:0,start:960,end:1020,subj:null,type:'learn',topics:[],count:0,timed:false,source:'',note:'',title:'',done:false},o)}
function pairTasks(subjId,d,start,sess,used){
 const topics=nextTopic(subjId,used);const ld=r15(sess*.55),td=sess-ld;const out=[mkTask({day:d,start,end:start+ld,subj:subjId,type:'learn',topics,source:'کتاب درسی'})];
 if(td>=20)out.push(mkTask({day:d,start:start+ld,end:start+sess,subj:subjId,type:'test',topics,count:r5(td/mpt(subjId)),source:'بانک تست'}));
 return out}
function genWeek(plan,o){
 const used=learnedKeys(Object.assign({},plan,{tasks:[]}),plan.sids[0]);const tasks=[];const cnt={};o.subjects.forEach(s=>cnt[s.id]=0);const log=[];
 for(let d=0;d<o.hours.length;d++){
  let t=o.start;const end=Math.min(o.start+o.hours[d],plan.end||S.settings.dayEnd);if(o.hours[d]<=0)continue;
  if(o.examDay===d){tasks.push(mkTask({day:d,start:t,end:t+180,type:'exam',title:'آزمون آزمایشی',source:'قلم‌چی'}));t+=180;tasks.push(mkTask({day:d,start:t+30,end:t+90,type:'fix',title:'تحلیل آزمون',note:'غلط‌ها و نزده‌ها رو دسته‌بندی کن'}));t+=105}
  if(o.review){const due={};log.filter(l=>d-l.d===1||d-l.d===3).forEach(l=>{(due[l.s]=due[l.s]||[]).push(...l.t)});for(const s in due){if(end-t<20)break;const len=Math.min(30,10+10*due[s].length);tasks.push(mkTask({opt:true,day:d,start:t,end:t+len,subj:s,type:'review',topics:[...new Set(due[s])],source:'جزوه/خلاصه',note:d-log.find(l=>l.s===s&&due[s].includes(l.t[0]))?.d===3?'مرور نوبت دوم (۳ روز بعد)':'مرور نوبت اول (فردا)'}));t+=len}if(Object.keys(due).length)t+=10}
  let last=null;
  while(end-t>=60&&o.subjects.length){
   const sess=Math.min(o.session,end-t);
   const cand=o.subjects.filter(s=>s.w>0).sort((a,b)=>(cnt[a.id]/a.w)-(cnt[b.id]/b.w));
   let pick=cand.find(s=>s.id!==last)||cand[0];if(!pick)break;
   const pr=o.withTest?pairTasks(pick.id,d,t,sess,used):[mkTask({day:d,start:t,end:t+sess,subj:pick.id,type:'learn',topics:nextTopic(pick.id,used),source:'کتاب درسی'})];
   tasks.push(...pr);log.push({d,s:pick.id,t:pr[0].topics});cnt[pick.id]++;last=pick.id;t+=sess+o.brk}
 }
 return o.notime?tasks.map(t=>({...t,notime:true,start:0,end:t.end-t.start})):tasks}

function makePlan(){
 const C=UI.create;const dates=[...C.dates].sort();const name=($('#cName')?.value||'').trim()||'برنامهٔ '+rngK(dates);
 const p={id:uid(),name,wk:dates[0],dates,sids:[...C.sids],status:'draft',tasks:[],start:S.settings.dayStart,end:S.settings.dayEnd};
 const slotOf=w=>p.dates.findIndex((_,i)=>wdi(p,i)===w);
 if(C.from==='copy'){const prev=S.plans.filter(x=>x.sids.includes(C.sids[0])&&x.dates[0]<dates[0]).sort((a,b)=>a.dates[0]<b.dates[0]?1:-1)[0];
  p.tasks=prev.tasks.map(t=>({...t,id:uid(),done:false,day:slotOf(wdi(prev,t.day))})).filter(t=>t.day>=0);
  p.routines=(prev.routines||[]).map(x=>({...x,id:uid(),days:PD(p).filter(i=>x.days.some(j=>wdi(prev,j)===wdi(p,i)))}))}
 if(C.from==='tpl'){const tp=S.templates.find(t=>t.id===C.tpl);PD(p).filter(i=>C.tplDays.includes(wdi(p,i))).forEach(d=>tp.tasks.forEach(t=>p.tasks.push(mkTask({...t,id:uid(),day:d}))))}
 S.plans.push(p);save();UI.planId=p.id;UI.day=Math.max(0,tdi(p));UI.mode='day';go('editor');
 if(C.from==='ai')go('assist');if(C.from==='quick')go('quick');
}

function taskTitle(t){if(t.type==='exam'||(!t.subj&&t.title))return t.title||TYPES[t.type].n;return subj(t.subj)?.n||'—'}
function taskHTML(t,conf){
 const s=subj(t.subj);const col=s?.c||TYPES[t.type].c;const ty=TYPES[t.type];
 const bits=[];if(t.topics.length)bits.push(esc(t.topics.join('، ')));if(t.type==='test'&&t.count)bits.push(fa(t.count)+' تست'+(t.timed?' · زمان‌دار':''));if(t.source)bits.push('منبع: '+esc(t.source));if(t.title&&t.subj)bits.push(esc(t.title));
 return `<div class="task ${t.done?'done':''} ${t.opt?'opt':''}"><div class="clr" style="background:${col}"></div><div class="bd">${t.opt?`<div class="optb"><span>پیشنهادی ${t.why?'· '+esc(t.why):''}</span><button data-act="tPin" data-t="${t.id}">📌 اجباری کن</button><button data-act="tDel" data-t="${t.id}">✕ رد</button></div>`:''}
  <div class="row wrap"><span class="tm">${t.notime?'⏱ '+dur(t.end-t.start):fhm(t.start)+'–'+fhm(t.end)}</span><span class="tp" style="background:${ty.c}">${ty.n}</span>${t.notime?'<span class="small muted">ساعت آزاد</span>':`<span class="small muted">${dur(t.end-t.start)}</span>`}${conf?'<span class="conf">تداخل</span>':''}</div>
  <div class="ttl">${esc(taskTitle(t))}</div>${t.desc?`<div class="dsc">${esc(t.desc)}</div>`:''}${bits.length?`<div class="meta">${bits.join(' · ')}</div>`:''}${t.note?`<div class="note">📝 ${esc(t.note)}</div>`:''}</div>
  <div class="acts"><button class="ib" title="انجام شد" data-act="tDone" data-t="${t.id}" style="color:${t.done?'var(--ok)':''}">${t.done?'☑':'☐'}</button><button class="ib" title="ویرایش" data-act="tEdit" data-t="${t.id}">✎</button><button class="ib" title="بیشتر" data-act="tMenu" data-t="${t.id}">⋯</button></div></div>`}
function balanceHTML(p){
 const by={};p.tasks.forEach(t=>{const k=t.subj||'_'+t.type;by[k]=(by[k]||0)+t.end-t.start});
 const tot=Object.values(by).reduce((a,b)=>a+b,0)||1;const max=Math.max(1,...Object.values(by));
 const ty={};p.tasks.forEach(t=>ty[t.type]=(ty[t.type]||0)+t.end-t.start);
 const tests=p.tasks.filter(t=>t.type==='test').reduce((a,t)=>a+(t.count||0),0);
 const rows=Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([k,v])=>{const s=subj(k);const n=s?s.n:TYPES[k.slice(1)].n;const c=s?s.c:TYPES[k.slice(1)].c;return `<div class="br" ${s?`data-act="sbEdit" data-k="${k}" style="cursor:pointer" title="تغییر رنگ"`:''}><span class="nm">${esc(n)}</span><span class="tr"><i style="width:${v/max*100}%;background:${c}"></i></span><span class="v">${fa(Math.round(v/tot*100))}٪ · ${fa((v/60).toFixed(1))}h</span></div>`}).join('');
 const lastWk=S.plans.filter(x=>x.sids.some(s=>p.sids.includes(s))&&x.wk<p.wk).sort((a,b)=>a.wk<b.wk?1:-1)[0];
 const miss=['bio','chem','phys','math'].filter(id=>!by[id]);
 return `<div class="bal">${rows||'<div class="muted small">هنوز کاری نیست.</div>'}
  <div class="tsec">نوع فعالیت</div><div class="chips">${Object.keys(TYPES).filter(k=>ty[k]).map(k=>`<span class="chip" style="padding:5px 10px"><span class="dot" style="background:${TYPES[k].c}"></span>${TYPES[k].n} ${fa((ty[k]/60).toFixed(1))}h</span>`).join('')}</div>
  <div class="tsec">جمع تست هفته: <b style="color:var(--ink)">${fa(tests)}</b>${lastWk?` · هفتهٔ قبل: ${fa(lastWk.tasks.filter(t=>t.type==='test').reduce((a,t)=>a+(t.count||0),0))}`:''}</div>
  ${p.tasks.length&&miss.length?`<div class="demo mt1" style="background:#fff1d6;color:#9a4b05">این هفته اصلاً ${miss.map(m=>subj(m).n).join('، ')} ندارد.</div>`:''}</div>`}

  ${m>540?`<div class="demo mt1" style="background:#fde8ec;color:#b4234a">این روز بیش از ۹ ساعت است؛ احتمال انجام کامل پایین می‌آید.</div>`:''}
  <div style="display:grid;gap:8px" class="mt1">${h||`<div class="empty"><b>این روز خالی است</b><div class="sub mt1">روز استراحت است؟ یا با دکمهٔ + کار بگذارید، یا یک قالب روز اعمال کنید.</div><div class="chips mt" style="justify-content:center">${S.templates.map(t=>`<button class="chip" data-act="applyTpl" data-k="${t.id}">▦ ${esc(t.name)}</button>`).join('')}${PD(p).includes(d-1)&&dayMin(p.tasks,d-1)?`<button class="chip" data-act="copyPrevDay">⧉ کپی ${dn(d-1)}</button>`:''}</div></div>`}</div>`;

function closeSheet(){R=null;IT=null;EX=null;$('#ov').classList.remove('show');$('#ovc').innerHTML='';F=null;WZ=null;CMD=null;closeMenu()}

 }

/* ========== COMMAND ENGINE (rule-based demo of the AI editor) ========== */
const NUMW={'یک':1,'دو':2,'سه':3,'چهار':4,'پنج':5,'شش':6,'هفت':7,'هشت':8,'نه':9,'ده':10};
const SUBJW=[['زمین','geo'],['هویت','hoviat'],['زیست','bio'],['شیمی','chem'],['فیزیک','phys'],['ریاضی','math'],['فارسی','fa'],['ادبیات','fa'],['عربی','ar'],['دین','din'],['معارف','din'],['زبان','en'],['سلامت','health']];
function findDays(s){const p=plan();const W=new Set(),out=new Set();const r=/(یکشنبه|دوشنبه|سهشنبه|چهارشنبه|پنجشنبه|شنبه|جمعه)/g;let m;const map={'شنبه':0,'یکشنبه':1,'دوشنبه':2,'سهشنبه':3,'چهارشنبه':4,'پنجشنبه':5,'جمعه':6};while((m=r.exec(s)))W.add(map[m[1]]);if(/آخر ?هفته/.test(s)){W.add(5);W.add(6)}PD(p).forEach(i=>{if(W.has(wdi(p,i)))out.add(i)});const rd=s.match(/روز\s*(\d+)/g);if(rd)rd.forEach(x=>{const k=+x.replace(/\D/g,'')-1;if(k>=0&&k<p.dates.length)out.add(k)});if(s.includes('امروز'))out.add(UI.day);if(s.includes('فردا')&&UI.day<p.dates.length-1)out.add(UI.day+1);return [...out]}
function findSubj(s,p){for(const [w,f] of SUBJW)if(s.includes(w)){const inPlan=[...new Set(p.tasks.map(t=>t.subj).filter(x=>x&&fam(x)===f))];return inPlan[0]||subjects().find(x=>fam(x.id)===f&&(x.g==='core'||x.g==='gen'))?.id||subjects().find(x=>fam(x.id)===f)?.id}return null}
function findNum(s){const m=s.match(/(\d+(\.\d+)?)/);if(m)return +m[1];for(const w in NUMW)if(new RegExp('(^|\\s)'+w+'(\\s|$)').test(s))return NUMW[w];if(s.includes('نیم'))return .5;return null}
function desc(t){return `${dn(t.day)} ${tl(t)} · ${esc(taskTitle(t))} · ${TYPES[t.type].n}${t.count?' · '+fa(t.count)+' تست':''}`}
function planCmd(raw){
 const p=plan();const s=en(raw).replace(/‌/g,'').replace(/(یک|دو|سه|چهار|پنج)\s+شنبه/g,'$1شنبه').trim();
 const sim=JSON.parse(JSON.stringify(p.tasks));const ops=[];const days=findDays(s);const sb=findSubj(s,p);const n=findNum(s);
 const used=learnedKeys(p,p.sids[0]);
 const del=t=>{ops.push({k:'del',t:{...t}});sim.splice(sim.findIndex(x=>x.id===t.id),1)};
 const add=t=>{if(p.defNoTime)t={...t,notime:true,end:t.end-t.start,start:0};ops.push({k:'add',t});sim.push(t)};
 const moveOut=(t,avoid)=>{const cands=PD(p).filter(d=>!avoid.includes(d)).sort((a,b)=>dayMin(sim,a)-dayMin(sim,b));for(const d of cands){const st=t.notime?0:firstFree(sim,d,t.end-t.start,null,p);if(st!=null){const o=sim.find(x=>x.id===t.id);const from={...o};o.day=d;o.end=st+(o.end-o.start);o.start=st;ops.push({k:'move',t:from,to:{...o}});return}}del(t)};
 const presentSubj=()=>{const c={};sim.forEach(t=>{if(t.subj&&t.type!=='exam')c[t.subj]=(c[t.subj]||0)+1});const l=Object.keys(c);return l.length?l:['bio','chem','phys','math']};
 const fill=(d,target)=>{const subs=presentSubj();let i=0,guard=0;while(dayMin(sim,d)<target-45&&guard++<10){const need=Math.min(90,target-dayMin(sim,d));const st=firstFree(sim,d,need,960,p)??firstFree(sim,d,need,null,p);if(st==null)break;const cnt={};sim.filter(t=>t.day===d).forEach(t=>cnt[t.subj]=1);const pick=subs.filter(x=>!cnt[x])[0]||subs[i++%subs.length];pairTasks(pick,d,st,r15(need),used).forEach(add)}};
 const trim=(d,target,move,avoid)=>{const order={test:0,learn:1,fix:2,sum:3,review:4,exam:5};const l=dayTasks(sim,d).filter(t=>move==='all'||t.type!=='exam').sort((a,b)=>order[a.type]-order[b.type]||b.start-a.start);for(const t of l){if(dayMin(sim,d)<=target)break;move?moveOut(t,avoid):del(t)}};
 let title='';
 if(/(از صفر|دوباره بچین|ازنو|از نو)/.test(s)){
  const h=(n&&n<=14?n:5)*60;const o={hours:PD(p).map(i=>wdi(p,i)===6?Math.min(h,120):h),start:960,session:90,brk:15,subjects:presentSubj().map(id=>({id,w:fam(id)==='bio'?3:2})),withTest:true,review:true,examDay:-1};
  if(/جمعه/.test(s)&&/(تعطیل|استراحت|خالی)/.test(s))PD(p).forEach(i=>{if(wdi(p,i)===6)o.hours[i]=0});
  sim.slice().forEach(del);genWeek({...p,tasks:[]},o).forEach(add);title='بازچینی کل هفته، روزی '+dur(h);
 }else if(days.length&&/(تعطیل|استراحت|خالی|آف|آزاد)/.test(s)){
  days.forEach(d=>trim(d,0,'all',days));title=days.map(d=>dn(d)).join(' و ')+' خالی شود (کارها به روزهای سبک‌تر منتقل می‌شوند)';
 }else if(days.length&&/(سبک|کم کن|کمتر|خلوت)/.test(s)&&!sb){
  days.forEach(d=>trim(d,dayMin(sim,d)*(n&&n<12?Math.min(1,n*60/Math.max(1,dayMin(sim,d))):.5),true,days));title=days.map(d=>dn(d)).join(' و ')+' سبک شود';
 }else if(/روزی|هر روز|روزانه/.test(s)&&n){
  const target=n*60;const ex=/(جز|بجز|غیر از)/.test(s)?days:[];for(const d of PD(p)){if(ex.includes(d))continue;const m=dayMin(sim,d);if(m>target+20)trim(d,target,false);else if(m<target-45)fill(d,target)}title='هر روز حدود '+dur(target)+(ex.length?' (به جز '+ex.map(d=>dn(d)).join('، ')+')':'');
 }else if(sb&&/(حذف|برداری|نباشه|نباشد)/.test(s)){
  sim.filter(t=>t.subj===sb&&(!days.length||days.includes(t.day))).forEach(del);title=subj(sb).n+' حذف شود';
 }else if(sb&&/(کمتر|کم کن|سبک)/.test(s)){
  sim.filter(t=>t.subj===sb).sort((a,b)=>(a.type==='test'?0:1)-(b.type==='test'?0:1)).filter((_,i,a)=>i<Math.ceil(a.length/2)).forEach(del);title=subj(sb).n+' کمتر شود';
 }else if(sb&&/(بیشتر|اضافه|دو برابر|زیاد)/.test(s)){
  let k=/دو ?برابر/.test(s)?Math.max(2,sim.filter(t=>t.subj===sb&&t.type==='learn').length):(n&&n<8?n:2);
  const ds=(days.length?days:PD(p)).sort((a,b)=>dayMin(sim,a)-dayMin(sim,b));let i=0,g=0;
  while(k>0&&g++<20){const d=ds[i++%ds.length];const st=firstFree(sim,d,90,960,p)??firstFree(sim,d,90,null,p);if(st==null)continue;pairTasks(sb,d,st,90,used).forEach(add);k--}title=subj(sb).n+' بیشتر شود';
 }else if(/مرور/.test(s)){
  sim.filter(t=>t.type==='learn').forEach(L=>[1,3].forEach(k=>{const d=L.day+k;if(d>=p.dates.length)return;if(sim.some(t=>t.day===d&&t.type==='review'&&t.subj===L.subj&&L.topics.every(x=>t.topics.includes(x))))return;const st=firstFree(sim,d,20,null,p);if(st!=null)add(mkTask({opt:true,day:d,start:st,end:st+20,subj:L.subj,type:'review',topics:[...L.topics],source:'جزوه/خلاصه',note:k===1?'مرور نوبت اول':'مرور نوبت دوم'}))}));title='مرور فاصله‌دار برای همهٔ یادگیری‌ها';
 }else if(/تست/.test(s)&&/(بیشتر|زیاد|اضافه)/.test(s)){
  const f=n&&n>2?n/100+1:1.5;sim.filter(t=>t.type==='test'&&(!sb||t.subj===sb)).forEach(t=>{const nc=r5(t.count*f);const ne=t.start+Math.round(nc*mpt(t.subj));const ok=t.notime||!sim.some(x=>!x.notime&&x.id!==t.id&&x.day===t.day&&x.start<ne&&t.start<x.end)&&ne<=p.end;const from={...t};t.count=nc;if(ok)t.end=ne;ops.push({k:'upd',t:from,to:{...t}})});title='تعداد تست‌ها '+fa(Math.round((f-1)*100))+'٪ بیشتر';
 }
 return {title,ops,sim}}
function openCmd(text){
 if(!text.trim())return;const r=planCmd(text);CMD=r;
 let body;
 if(!r.ops.length&&r.title)body=`<div class="demo mt"><b>${esc(r.title)}</b><br>تغییری لازم نبود (یا جای خالی برای انجامش پیدا نشد).</div>`;
 else if(!r.ops.length)body=`<div class="demo mt">این دستور را نفهمیدم یا تغییری لازم نبود.<br>در نسخهٔ دمو این‌ها را می‌فهمد: «جمعه را سبک کن»، «پنجشنبه تعطیل»، «روزی ۶ ساعت به جز جمعه»، «زیست را بیشتر کن / دو برابر»، «فیزیک را کمتر کن»، «شیمی حذف»، «مرور اضافه کن»، «تست‌ها را ۳۰٪ بیشتر کن»، «کل هفته را از صفر بچین روزی ۵ ساعت».<br>در نسخهٔ نهایی به هوش مصنوعی وصل می‌شود و هر جمله‌ای را می‌فهمد.</div>`;
 else{const c={add:0,del:0,move:0,upd:0};r.ops.forEach(o=>c[o.k]++);const show=r.ops.slice(0,40);
  body=`<div class="tsec">«${esc(text)}»</div><b>${esc(r.title)}</b><div class="chips mt1">${c.add?`<span class="badge b-active">+${fa(c.add)} اضافه</span>`:''}${c.del?`<span class="badge b-none">−${fa(c.del)} حذف</span>`:''}${c.move?`<span class="badge b-shared">${fa(c.move)} جابه‌جایی</span>`:''}${c.upd?`<span class="badge b-draft">${fa(c.upd)} تغییر</span>`:''}</div>
  <div class="mt1">${show.map(o=>`<div class="op"><span class="k k-${o.k}">${{add:'+',del:'−',move:'↷',upd:'✎'}[o.k]}</span><div>${o.k==='move'?`${desc(o.t)}<div class="small" style="color:#2563eb">← ${dn(o.to.day)} ${fhm(o.to.start)}–${fhm(o.to.end)}</div>`:o.k==='upd'?`${desc(o.t)}<div class="small" style="color:#d97706">← ${fa(o.to.count)} تست، ${fhm(o.to.start)}–${fhm(o.to.end)}</div>`:desc(o.t)}</div></div>`).join('')}${r.ops.length>40?`<div class="small muted mt1">و ${fa(r.ops.length-40)} تغییر دیگر…</div>`:''}</div>`}
 openSheet('پیشنهاد دستیار',body,r.ops.length?`<div class="row"><button class="btn ghost" data-act="closeSheet">رد</button><button class="btn block" data-act="cmdApply">اعمال تغییرات</button></div>`:'',true)}

/* ========== review & activate ========== */
function openReview(){
 const p=plan();const conf=conflicts(p.tasks);const items=[];
 items.push(conf.size?['b',`${fa(conf.size)} کار با هم تداخل زمانی دارند.`]:['ok','تداخل زمانی ندارد.']);
 const heavy=PD(p).filter(d=>dayMin(p.tasks,d)>540);items.push(heavy.length?['w','روزهای سنگین (بیش از ۹ ساعت): '+heavy.map(d=>dn(d)).join('، ')]:['ok','هیچ روزی بیش از ۹ ساعت نیست.']);
 const empty=PD(p).filter(d=>!dayMin(p.tasks,d));items.push(empty.length?['w','روزهای بدون کار: '+empty.map(d=>dn(d)).join('، ')+' (اگر استراحت است، مشکلی نیست)']:['ok','همهٔ روزها کار دارند.']);
 const noRev=p.tasks.filter(L=>L.type==='learn'&&!p.tasks.some(t=>t.type==='review'&&t.subj===L.subj&&t.day>L.day&&L.topics.some(x=>t.topics.includes(x))));items.push(noRev.length?['w',`${fa(noRev.length)} یادگیری در همین هفته مرور ندارد. <button style="color:var(--p);font-weight:800" data-act="cmdQuick" data-c="مرور اضافه کن">مرورها را اضافه کن</button>`]:['ok','همهٔ یادگیری‌ها مرور دارند.']);
 const lt=p.tasks.filter(t=>t.type==='learn').reduce((a,t)=>a+t.end-t.start,0),tt=p.tasks.filter(t=>t.type==='test').reduce((a,t)=>a+t.end-t.start,0);
 if(lt&&tt<lt*.4)items.push(['w','نسبت تست به یادگیری کم است. <button style="color:var(--p);font-weight:800" data-act="cmdQuick" data-c="تست‌ها را بیشتر کن">تست بیشتر</button>']);
 const tot=p.tasks.reduce((a,t)=>a+t.end-t.start,0);
 const body=`<div class="mt1">${items.map(([k,m])=>`<div class="chk"><span class="s s-${k}">${k==='ok'?'✓':k==='w'?'!':'×'}</span><div>${m}</div></div>`).join('')}</div>
 <div class="card mt"><div class="between"><span>جمع هفته</span><b>${dur(tot)}</b></div><div class="between mt1"><span>تعداد کار</span><b>${fa(p.tasks.length)}</b></div><div class="between mt1"><span>برای</span><b>${esc(p.sids.map(id=>stu(id)?.name).join('، '))}</b></div></div>`;
 openSheet('بازبینی برنامه',body,p.status==='active'?`<div class="row"><button class="btn ghost" data-act="setStatus" data-k="draft">برگرداندن به پیش‌نویس</button><button class="btn block" data-act="closeSheet">باشه</button></div>`:`<button class="btn block" style="padding:15px" data-act="setStatus" data-k="active" ${p.tasks.length?'':'disabled'}>فعال‌سازی برنامه</button>`)}

function planText(p){
 let s=`📅 ${p.name}\n👤 ${p.sids.map(id=>stu(id)?.name).join('، ')}\n${p.msg?'💬 '+p.msg+'\n':''}`;if(p.snotes&&Object.values(p.snotes).some(Boolean)){s+='\n📌 توضیحات درس‌ها\n';Object.entries(p.snotes).forEach(([k,v])=>{if(v)s+=`• ${subj(k)?.n||'سایر'}: ${v}\n`})}if(p.routines?.length){s+='\n✨ روتین‌ها\n';p.routines.forEach(x=>{s+=`☑️ ${rName(x)}${x.min?' ('+x.min+' دقیقه)':''} — ${rDays(x,p)}\n`})}
 for(const d of PD(p)){const l=dayTasks(p.tasks,d);s+=`\n🔹 ${dn(d)} ${dlb(p,d)}${l.length?' — '+dur(dayMin(p.tasks,d)):' — استراحت'}\n`;l.forEach(t=>{s+=`${t.opt?'▫️ (پیشنهادی) ':'▫️ '}${tlTxt(t)} | ${taskTitle(t)} | ${TYPES[t.type].n}${t.count?' | '+t.count+' تست'+(t.timed?' (زمان‌دار)':''):''}${t.desc?'\n    👈 '+t.desc:''}${t.topics.length?'\n    مبحث: '+t.topics.join('، '):''}${t.source?'\n    منبع: '+t.source:''}${t.note?'\n    📝 '+t.note:''}\n`})}
 return fa(s)}

function exInner(p,o){
 const names=p.sids.map(id=>stu(id)?.name).join('، ');const tot=p.tasks.reduce((a,t)=>a+t.end-t.start,0);const tests=p.tasks.filter(t=>t.type==='test').reduce((a,t)=>a+(t.count||0),0);
 const by={};p.tasks.forEach(t=>{if(t.subj)by[t.subj]=(by[t.subj]||0)+t.end-t.start});
 const col=t=>subj(t.subj)?.c||TYPES[t.type].c;
 const head=`<div class="x-hd"><div><div class="x-k">برنامهٔ هفتگی مطالعه</div><h1>${esc(names)}</h1><div class="x-s">${rng(p)}</div></div><div class="x-st"><div><b>${fa((tot/60).toFixed(1).replace('.0',''))}</b><span>ساعت</span></div><div><b>${fa(tests)}</b><span>تست</span></div><div><b>${fa(p.tasks.length)}</b><span>کار</span></div></div></div>
 ${p.msg?`<div class="x-msg">💬 ${esc(p.msg)}</div>`:''}
 ${o.bal&&Object.keys(by).length?`<div class="x-bal">${Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<span><i style="background:${subj(k).c}"></i>${esc(subj(k).n)} · ${dur(v)}</span>`).join('')}</div>`:''}`;
 const D=PD(p);const dl=i=>`روز ${fa(D.indexOf(i)+1)} · ${dn(i)} ${dlb(p,i)}`;
 const meta=t=>{const m=[];if(t.type==='test'&&t.count)m.push(fa(t.count)+' تست'+(t.timed?' · زمان‌دار':''));if(o.src&&t.source)m.push('منبع: '+esc(t.source));return m};
 const FN={};let fk=0;D.forEach(i=>dayTasks(p.tasks,i).forEach(t=>{if(t.note&&!/^مرور نوبت/.test(t.note)||(t.desc&&t.desc.length>38))FN[t.id]=++fk}));
 const fnb=t=>FN[t.id]?`<span class="x-fn">ⓘ${fa(FN[t.id])}</span>`:'';
 const RT=p.routines||[];
 const rtLine=x=>`<div class="x-rti"><span>☆ ${esc(x.text)}${x.min?' · '+fa(x.min)+'′':''}</span><span class="bx">${D.map(i=>`<i class="${x.days.includes(i)?'':'off'}">${x.days.includes(i)?ds(i)[0]:''}</i>`).join('')}</span></div>`;
 const habit=()=>RT.length?`<h2 class="x-h2">روتین‌های هفته</h2><div class="x-tw"><table class="x-hab"><tr><th>روتین</th>${D.map(i=>`<th>${ds(i)}</th>`).join('')}</tr>${RT.map(x=>`<tr><td><i style="background:${subj(x.subj)?.c||'#D99A1F'}"></i>${esc(rName(x))}${x.min?' · '+fa(x.min)+'′':''}</td>${D.map(i=>`<td>${x.days.includes(i)?'<b>☐</b>':'·'}</td>`).join('')}</tr>`).join('')}</table></div>`:'';
 const row=(t,withSubj)=>{const mt=meta(t);return `<div class="x-t ${t.opt?'x-opt':''}" style="--c:${col(t)};--c2:${TYPES[t.type].c}">${o.check?'<i class="x-cb"></i>':''}<div class="x-tm">${t.notime?'⏱<br>'+fa(t.end-t.start)+'′':fhm(t.start)+'<br>'+fhm(t.end)}</div><div class="x-b"><div class="x-ti">${withSubj?`<b>${esc(taskTitle(t))}</b>`:(t.title&&!t.subj?`<b>${esc(t.title)}</b>`:'')}<span class="x-ty">${TYPES[t.type].n}</span>${t.opt?'<span class="x-ob">پیشنهادی</span>':''}${fnb(t)}</div>${t.desc?`<div class="x-ds">${esc(t.desc)}</div>`:''}${t.topics.length?`<div class="x-tp">${esc(t.topics.join('، '))}</div>`:''}${mt.length?`<div class="x-mt">${mt.join(' · ')}</div>`:''}${t.note?`<div class="x-nt">📝 ${esc(t.note)}</div>`:''}</div></div>`};
 const table=()=>`<div class="x-tw"><table class="x-tbl"><tr>${D.map(i=>`<th>روز ${fa(D.indexOf(i)+1)} · ${dn(i)}${exOn(p,i)?'<br>🎯 '+esc(exOn(p,i)):''}<small>${dlb(p,i)}${dayMin(p.tasks,i)?' · '+dur(dayMin(p.tasks,i)):''}</small></th>`).join('')}</tr><tr>${D.map(i=>`<td>${dayTasks(p.tasks,i).map(t=>`<div class="x-mi ${t.opt?'x-opt':''}" style="--c:${col(t)}"><b>${o.check?'☐ ':''}${t.opt?'(پیشنهادی) ':''}${esc(taskTitle(t))} ${fnb(t)}</b>${tl(t)} · ${TYPES[t.type].n}${t.count?' · '+fa(t.count)+' تست':''}${t.desc?`<div class="cl2" style="font-weight:700">${esc(t.desc)}</div>`:''}${t.topics.length?`<div class="cl1">${esc(t.topics.join('، '))}</div>`:''}</div>`).join('')||'<div class="x-rest">🌿</div>'}</td>`).join('')}</tr>${o.rep?`<tr>${D.map(()=>`<td style="font-size:11px;color:#888">ساعت واقعی: …<br>تست: …</td>`).join('')}</tr>`:''}</table></div>`;
 const cards=()=>`<div class="x-days">${D.map(i=>{const l=dayTasks(p.tasks,i);const m=dayMin(p.tasks,i);
   return `<section class="x-day"><div class="x-dh"><b>روز ${fa(D.indexOf(i)+1)} · ${dn(i)}</b><span>${dlb(p,i)}</span>${m?`<em>${dur(m)}</em>`:''}</div>${RT.filter(x=>x.days.includes(i)).length?`<div class="x-rd"><b>✦ روتین امروز</b>${RT.filter(x=>x.days.includes(i)).map(x=>`<div>☐ ${esc(rName(x))}${x.min?' · '+fa(x.min)+'′':''}</div>`).join('')}</div>`:''}${l.length?l.map(t=>row(t,true)).join(''):'<div class="x-rest">🌿 استراحت</div>'}
   ${o.rep&&l.length?`<div class="x-rep"><span>ساعت واقعی: ……</span><span>تست زده: ……</span><span>حال امروز: 😀 😐 😞</span></div>`:''}</section>`}).join('')}</div>`;
 const subjects=()=>{const g={};p.tasks.forEach(t=>{const k=t.subj||'_o';(g[k]=g[k]||[]).push(t)});RT.forEach(x=>{const k=x.subj||'_o';g[k]=g[k]||[]});
  const keys=Object.keys(g).sort((a,b)=>a==='_o'?1:b==='_o'?-1:g[b].reduce((x,t)=>x+t.end-t.start,0)-g[a].reduce((x,t)=>x+t.end-t.start,0));
  return `<div class="x-subs">${keys.map(k=>{const l=g[k];const s0=subj(k);const c=s0?s0.c:'#64748b';const tm=l.reduce((x,t)=>x+t.end-t.start,0);const ts=l.filter(t=>t.type==='test').reduce((x,t)=>x+(t.count||0),0);
   return `<section class="x-sub" style="--c:${c}"><div class="x-sh"><b>${esc(s0?s0.n:'عمومی و سایر')}</b><em>${dur(tm)}${ts?' · '+fa(ts)+' تست':''}</em></div>${(p.snotes||{})[k]?`<div class="x-snote">📌 ${esc(p.snotes[k])}</div>`:''}${RT.filter(x=>(x.subj||'_o')===k).length?`<div class="x-rt"><b>روتین</b>${RT.filter(x=>(x.subj||'_o')===k).map(rtLine).join('')}</div>`:''}${D.filter(i=>l.some(t=>t.day===i)).map(i=>`<div class="x-sd"><div class="x-sdl">${dl(i)}</div>${dayTasks(l,i).map(t=>row(t,k==='_o')).join('')}</div>`).join('')}</section>`}).join('')}</div>`};
 const B=S.settings.brand||{};
 const mtable=()=>{const g={};p.tasks.forEach(t=>{const k=t.subj||'_o';(g[k]=g[k]||[]).push(t)});RT.forEach(x=>{const k=x.subj||'_o';g[k]=g[k]||[]});
  const keys=Object.keys(g).sort((a,b)=>a==='_o'?1:b==='_o'?-1:g[b].reduce((x,t)=>x+t.end-t.start,0)-g[a].reduce((x,t)=>x+t.end-t.start,0));
  const tdesc=t=>`<div class="x-ml ${t.opt?'x-opt':''}"><span class="x-ty" style="--c2:${TYPES[t.type].c}">${TYPES[t.type].n}</span>${t.opt?' <span class="x-ob">پیشنهادی</span>':''} ${!t.subj&&t.title?'<b>'+esc(t.title)+'</b> ':''}${t.desc?'<b>'+esc(t.desc)+'</b> ':''}${t.topics.length?esc(t.topics.join('، ')):''}${t.type==='test'&&t.count?' · '+fa(t.count)+' تست'+(t.timed?' زمان‌دار':''):''}${o.src&&t.source?' · <span class="x-src">'+esc(t.source)+'</span>':''}${t.note?'<div class="x-mn">📝 '+esc(t.note)+'</div>':''}</div>`;
  return keys.map(k=>{const l=g[k];const s0=subj(k);const c=s0?s0.c:'#64748b';const rts=RT.filter(x=>(x.subj||'_o')===k);const ds_=D.filter(i=>l.some(t=>t.day===i));
   return `<section class="x-mt2" style="--c:${c}"><div class="x-mth"><span class="x-mic"></span><b>${esc(s0?s0.n:'عمومی و سایر')}</b><em>${dur(l.reduce((x,t)=>x+t.end-t.start,0))}</em></div>${(p.snotes||{})[k]?`<div class="x-snote">📌 ${esc(p.snotes[k])}</div>`:''}${rts.length?`<div class="x-rt"><b>روتین</b>${rts.map(rtLine).join('')}</div>`:''}${ds_.length?`<table class="x-ct"><tr><th style="width:92px">روز</th><th style="width:92px">زمان</th><th>شرح کار</th>${o.check?'<th style="width:40px">✓</th>':''}</tr>${ds_.map(i=>{const tt=dayTasks(l,i);const m=tt.reduce((x,t)=>x+t.end-t.start,0);const timed=tt.filter(t=>!t.notime);return `<tr><td><b>روز ${fa(i+1)}</b><br><small>${dn(i,p)} ${pDate(pd(p,i),{day:'numeric',month:'short'})}</small></td><td>${timed.length===tt.length&&tt.length?`<span dir="ltr">${fhm(tt[0].start)}–${fhm(tt[tt.length-1].end)}</span>`:''}<br><small>${dur(m)}</small></td><td>${tt.map(tdesc).join('')}</td>${o.check?'<td><i class="x-cb" style="--c:var(--a);margin:auto"></i></td>':''}</tr>`}).join('')}</table>`:''}</section>`}).join('')};
 const mhead=()=>`<div class="x-mh"><span class="x-c1"></span><span class="x-c2"></span><span class="x-dots"></span><div class="x-org">${esc(B.org||'برنامهٔ مطالعه')}</div>${B.slogan?`<div class="x-slg">${esc(B.slogan)}</div>`:''}<div class="x-zz"></div><div class="x-pp"><span>دانش‌آموز: <b>${esc(names)}</b></span><span>مشاور: <b>${esc(B.name||'—')}</b>${B.handle?' <small dir="ltr">'+esc(B.handle)+'</small>':''}</span><span>بازه: <b>${rng(p)}</b></span></div><div class="x-st x-st2"><div><b>${fa((tot/60).toFixed(1).replace('.0',''))}</b><span>ساعت</span></div><div><b>${fa(tests)}</b><span>تست</span></div><div><b>${fa(p.dates.length)}</b><span>روز</span></div></div></div>${p.msg?`<div class="x-msg">💬 ${esc(p.msg)}</div>`:''}<div class="x-ban">برنامهٔ مطالعه — درس به درس</div>`;
 let main;
 if(o.layout==='mtable')main=mtable()+`<div class="x-ban x-pb">برنامهٔ کامل روزانه</div>${table()}${habit()}`;

 else if(o.layout==='cards')main=cards();else main=table()+habit();
 return `<div class="x-wrap">${o.layout==='mtable'?mhead():head}${main}<div class="x-ft">${B.name||B.handle?`مشاور: <b>${esc(B.name||'')}</b> ${B.handle?'· <span dir="ltr">'+esc(B.handle)+'</span>':''}`:'ساخته‌شده با برنامه‌ریز مشاور'}</div></div>`}

function vExport(){
 const p=plan();if(!p)return go('home');const o=EXO;

 const tg=(k,n)=>`<button class="chip ${o[k]?'on':''}" data-act="exO" data-k="${k}">${o[k]?'✓ ':''}${n}</button>`;

const WK={video:{n:'ویدیو آموزشی',u:'دقیقه فیلم',rk:'video',tt:'learn',st:'learn',i:'▶'},read:{n:'جزوه / درسنامه / کتاب',u:'صفحه',rk:'page',tt:'learn',st:'learn',i:'📖'},test:{n:'تست',u:'تست',rk:'test',tt:'test',st:'tbook',i:'✎'},desc:{n:'سؤال تشریحی / نهایی',u:'سؤال',rk:'q',tt:'test',st:'nq',i:'✍'},exam:{n:'آزمون',u:'آزمون',rk:'exam',tt:'exam',st:'az1',i:'⏱'},review:{n:'مرور',u:'دقیقه',rk:null,tt:'review',st:'rev',i:'↻'},other:{n:'کار دیگر',u:'دقیقه',rk:null,tt:'sum',st:'',i:'＋'}};

function defStage(type,sj){const k=subj(sj)?.g==='core';return {learn:'learn',test:k?'tbook':'nq',review:'rev',sum:'rev',exam:k?'az1':'ex1',fix:''}[type]??''}
function rateDef(sj,k){const f=fam(sj||'');return {video:1,page:5,test:MPT[f]||1.5,q:2,exam:['math','phys'].includes(f)?45:30}[k]}
function rateOf(sid,sj,k){const x=((S.rates||{})[sid]||{})[sj]||{};return x[k]??rateDef(sj,k)}
function itemQ(it){return it.half?Math.ceil(it.qty/2):it.qty}
function itemBase(it){if(it.off)return 0;return Math.round(WK[it.kind].rk?itemQ(it)*it.rate:it.qty)}
function itemRev(it){const b=itemBase(it);return it.revNext&&(it.kind==='video'||it.kind==='read')&&b?it.revNext*Math.ceil(b/90):0}
function itemMin(it){return itemBase(it)+itemRev(it)}
function Wk(p){p.work=p.work||{items:[],cap:{def:480,per:{}},reserve:0,modes:{},notime:true,step:1};p.work.items=p.work.items.filter(it=>subj(it.subj));return p.work}
function routineMin(p,d){return (p.routines||[]).filter(x=>x.days.includes(d)).reduce((a,x)=>a+(x.min||0),0)}
function capOf(p,d){const w=Wk(p);return Math.max(0,(w.cap.per[d]??w.cap.def)-routineMin(p,d))}

function budgets(p){const need=needBy(p);const av=availOf(p),tn=Object.values(need).reduce((a,b)=>a+b,0);const sc=tn>av&&tn?av/tn:1;const B={};Object.keys(need).forEach(sj=>{const sd=schedDays(p,sj);const tc=sd.reduce((a,d)=>a+capOf(p,d),0)||1;B[sj]={};sd.forEach(d=>B[sj][d]=need[sj]*capOf(p,d)/tc)});return {need,B,sc}}

 if(m=s.match(/^(\d+(?::\d{1,2})?(?:\.\d+)?)\s*[-–]\s*(\d+(?::\d{1,2})?(?:\.\d+)?)(?:\s+|$)(.*)$/)){const a=toMin(m[1]),b=toMin(m[2]);if(a!=null&&b!=null){min=Math.round((a+b)/2/5)*5;rt=fmtQ(a)+' تا '+fmtQ(b);s=m[3]}}

function chkGet(sid,sj,l){return ((S.chk[sid]||{})[sj]||{})[l]||{}}
function chkSet(sid,sj,l,k,v){S.chk[sid]=S.chk[sid]||{};S.chk[sid][sj]=S.chk[sid][sj]||{};const o=S.chk[sid][sj][l]=S.chk[sid][sj][l]||{};if(!v)delete o[k];else o[k]=v}
function chkPct(sid,sj){const T=topicsOf(sj),st=stagesOf(sj);if(!T.length)return 0;let d=0;T.forEach(t=>{const o=chkGet(sid,sj,t.l);st.forEach(([k])=>{if(o[k])d++})});return Math.round(d/(T.length*st.length)*100)}
function chkFromTask(p,t){if(!t.subj||!t.topics.length)return;if(t.stage){p.sids.forEach(sid=>t.topics.forEach(l=>{const o=chkGet(sid,t.subj,l);chkSet(sid,t.subj,l,t.stage,t.stage==='rev'?Math.min(9,(o.rev||0)+1):1)}));return}const st=stagesOf(t.subj).map(x=>x[0]);p.sids.forEach(sid=>t.topics.forEach(l=>{const o=chkGet(sid,t.subj,l);if(t.type==='learn')chkSet(sid,t.subj,l,'learn',1);else if(t.type==='test')chkSet(sid,t.subj,l,st.includes('tbook')?'tbook':'nhelp',1);else if(t.type==='review'||t.type==='sum')chkSet(sid,t.subj,l,'rev',Math.min(9,(o.rev||0)+1))}))}
